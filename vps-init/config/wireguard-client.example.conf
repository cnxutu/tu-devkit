# Windows WireGuard client template for the vps-init management tunnel.
# Copy this file outside the repository, replace only the five placeholders below,
# and never commit the completed client configuration.

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = 10.66.66.2/32

# DNS and IPv6 are intentionally omitted. Add them only after the corresponding
# VPS services and routes have been explicitly enabled and verified.

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
PresharedKey = <PRESHARED_KEY>
Endpoint = <VPS_PUBLIC_HOST>:<WIREGUARD_UDP_PORT>
AllowedIPs = 10.66.66.0/24
PersistentKeepalive = 25
