mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: ["VPS-SantaClara"]
    type: ["ss", "vmess", "trojan"]
    server: [your server]
    port: [your port]
    cipher: [your clipher]
    password: [your password]

proxy-groups:
  - name: 🚀 Proxy
    type: select
    proxies:
      - VPS-SantaClara
      - DIRECT

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query

  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://dns.google/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

