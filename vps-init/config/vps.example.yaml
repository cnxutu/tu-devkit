# Copy to vps.local.yaml. Do not store passwords, private keys, or real endpoints here.
server:
  public_endpoint: ""
ssh:
  current_port: 22
  port: 22222
  disable_root_login: true
  admin_authorized_keys_path: /home/admin/.ssh/authorized_keys
fail2ban:
  bantime: 1h
  findtime: 10m
  maxretry: 5
wireguard:
  enabled: false
  port: 60273
  ipv4_cidr: 10.66.66.0/24
  client_mode: full
  ipv6_enabled: false
  endpoint: ""
  outbound_interface: ""
sing_box:
  enabled: false
  port: 8080
  listen: 0.0.0.0
  method: 2022-blake3-aes-128-gcm
clash_remote:
  enabled: false
  port: 18080
  update_interval_hours: 24
