# Clash Meta / Mihomo 客户端配置模板
# 使用前必须替换 VPS-SantaClara 的 server/port/password；不要提交真实凭据。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
# ChatGPT 的 SSE/长连接走 TCP，避免部分网络对 QUIC/HTTP3 的丢包导致页面卡住。
disable-quic: true
keep-alive-interval: 30

proxies:
  # vps-init/scripts/generate-clash-profile.sh 生成的是 Shadowsocks 2022 节点。
  - name: VPS-SantaClara
    type: ss
    server: your.server.example
    port: 8080
    cipher: 2022-blake3-aes-128-gcm
    password: CHANGE_ME

proxy-groups:
  - name: 🚀 Proxy
    type: select
    proxies:
      - VPS-SantaClara
      - DIRECT

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 代理节点地址本身必须用直连 DNS 解析，避免形成 DNS 依赖环。
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  # OpenAI/ChatGPT 相关域名固定使用境外 DoH，避免污染或错误的 CN 结果。
  nameserver-policy:
    '+.chatgpt.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.openai.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.oaistatic.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.oaiusercontent.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'

rules:
  # ChatGPT 页面、登录、静态资源、验证、上传和流式连接必须使用同一代理。
  - DOMAIN-SUFFIX,chatgpt.com,🚀 Proxy
  - DOMAIN-SUFFIX,chat.openai.com,🚀 Proxy
  - DOMAIN-SUFFIX,openai.com,🚀 Proxy
