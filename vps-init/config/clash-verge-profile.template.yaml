# Clash Verge 代理配置模板（使用 Mihomo 内核）
# 使用前必须替换 VPS-SantaClara 的 server/port/password；不要提交真实凭据。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
# VPS sing-box/防火墙仅提供 TCP；提前禁用 QUIC，避免 ChatGPT/Codex 先走不可用 UDP 后重连。
disable-quic: true
keep-alive-interval: 30

proxies:
  # vps-init/scripts/generate-clash-profile.sh 生成的是 Shadowsocks 2022 节点。
  - name: "VPS-SantaClara"
    type: ss
    server: your.server.example
    port: 8080
    cipher: 2022-blake3-aes-128-gcm
    password: "CHANGE_ME"
    # 服务端仅开放 TCP；显式关闭节点 UDP，避免产生不可用的 QUIC 尝试。
    udp: false

proxy-groups:
  - name: 🚀 Proxy
    type: select
    proxies:
      - VPS-SantaClara
      - DIRECT

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 代理节点地址本身必须用直连 DNS 解析，避免形成 DNS 依赖环。
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  # OpenAI/ChatGPT 相关域名固定使用境外 DoH，避免污染或错误的 CN 结果。
  nameserver-policy:
    # 钉钉及阿里云媒体 CDN 使用国内 DNS，避免境外 DoH 返回境外节点。
    '+.dingtalk.com':
      - https://dns.alidns.com/dns-query
    '+.ddtalk.com':
      - https://dns.alidns.com/dns-query
    '+.dingtalkapps.com':
      - https://dns.alidns.com/dns-query
    '+.dingtalk.net':
      - https://dns.alidns.com/dns-query
    '+.dingtalk.cn':
      - https://dns.alidns.com/dns-query
    '+.ddurl.to':
      - https://dns.alidns.com/dns-query
    '+.ddimg.cn':
      - https://dns.alidns.com/dns-query
    '+.aliyuncs.com':
      - https://dns.alidns.com/dns-query
    '+.alicdn.com':
      - https://dns.alidns.com/dns-query
    '+.alibabausercontent.com':
      - https://dns.alidns.com/dns-query
    '+.chatgpt.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.openai.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.oaistatic.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.oaiusercontent.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.openaiusercontent.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    # ChatGPT 网页还依赖认证、Cloudflare 校验和会话服务；路由走代理时 DNS
    # 也必须保持一致，避免晚高峰下解析到不可达或错误的边缘节点。
    '+.auth0.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.cloudflare.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.cloudflare.net':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.cloudflareinsights.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.arkoselabs.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.statsigapi.net':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.statsig.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    # Postman 的云端同步、认证与工作区接口使用境外 DoH。
    '+.postman.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.getpostman.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.postmanlabs.com':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    '+.pstmn.io':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'

rules:
  # 钉钉登录、消息和图片上传/下载走本地直连，避免被海外 VPS 或境外 CDN 拦截。
  - DOMAIN-SUFFIX,dingtalk.com,DIRECT
  - DOMAIN-SUFFIX,ddtalk.com,DIRECT
  - DOMAIN-SUFFIX,dingtalkapps.com,DIRECT
  - DOMAIN-SUFFIX,dingtalk.net,DIRECT
